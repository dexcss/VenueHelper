name: Build & Release

on:
  push:
    tags:
      - 'v*'   # push a tag like v1.0.0.2 to trigger a release

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
        shell: pwsh

      - name: Restore
        run: dotnet restore VenueHelper/VenueHelper.csproj

      - name: Build
        run: dotnet build VenueHelper/VenueHelper.csproj -c Release --no-restore

      # DalamudPackager (bundled with Dalamud.NET.Sdk) produces a clean plugin
      # zip during the build. Find it wherever it landed and copy it out as
      # VenueHelper.zip so the release asset name is stable.
      - name: Locate packaged zip
        id: findzip
        run: |
          $zip = Get-ChildItem -Path VenueHelper/bin/Release -Recurse -Filter *.zip |
                 Where-Object { $_.Name -ne 'VenueHelper.zip' } |
                 Select-Object -First 1
          if (-not $zip) { Write-Error "No packaged zip found - DalamudPackager may not have run."; exit 1 }
          Copy-Item $zip.FullName -Destination VenueHelper/bin/Release/VenueHelper.zip -Force
          Write-Host "Packaged zip: $($zip.FullName)"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VenueHelper/bin/Release/VenueHelper.zip
          generate_release_notes: true
