name: Build & Release

on:
  push:
    tags:
      - 'v*'   # e.g. push tag v1.0.0.0 to trigger a release

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
        shell: pwsh

      - name: Restore
        run: dotnet restore VenueHelper/VenueHelper.csproj

      - name: Build
        run: dotnet build VenueHelper/VenueHelper.csproj -c Release --no-restore

      - name: Package
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path VenueHelper/bin/Release/* -DestinationPath VenueHelper/bin/Release/VenueHelper.zip -Force
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VenueHelper/bin/Release/VenueHelper.zip
          generate_release_notes: true
