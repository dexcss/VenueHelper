name: Build & Release

on:
  push:
    tags:
      - 'v*'   # push a tag like v1.0.0.4 to trigger a release

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
        shell: pwsh

      - name: Restore
        run: dotnet restore VenueHelper/VenueHelper.csproj

      - name: Build
        run: dotnet build VenueHelper/VenueHelper.csproj -c Release --no-restore

      # Trim native runtimes the game never uses. FFXIV + Dalamud are always
      # Windows x64, so QuestPDF's Linux/macOS/win-x86 native libs are dead
      # weight (~57MB). Keep only runtimes/win-x64.
      - name: Trim unused runtimes
        run: |
          $rt = "VenueHelper/bin/Release/runtimes"
          if (Test-Path $rt) {
            Get-ChildItem $rt -Directory |
              Where-Object { $_.Name -ne 'win-x64' } |
              Remove-Item -Recurse -Force
            Write-Host "Kept only win-x64. Remaining runtimes:"
            Get-ChildItem $rt -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "No runtimes folder found; nothing to trim."
          }
        shell: pwsh

      # Repackage into a clean zip after trimming. DalamudPackager's own zip is
      # made during build (before trimming), so we build our own from the
      # trimmed output instead, excluding the .pdb debug symbols.
      - name: Package
        run: |
          $out = "VenueHelper/bin/Release"
          Get-ChildItem $out -Filter *.zip | Remove-Item -Force
          Get-ChildItem $out -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Path "$out/*" -DestinationPath "$out/VenueHelper.zip" -Force
          $size = (Get-Item "$out/VenueHelper.zip").Length / 1MB
          Write-Host ("Final zip size: {0:N1} MB" -f $size)
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VenueHelper/bin/Release/VenueHelper.zip
          generate_release_notes: true
